{% extends 'base.html' %}

{% block content %}
<section class="section-content padding-y bg">
    <div class="container">
        <div class="row">
            {% include 'accounts/sidebar.html' %}
            
            <main class="col-md-9">
                <article class="card">
                    <header class="card-header">
                        <strong class="d-inline-block mr-3">Return & Refunds</strong>
                    </header>
                    <div class="card-body">
                        <div class="row mb-4 border-bottom pb-3">
                            <div class="col-md-2">
                                <img src="https://via.placeholder.com/80" class="img-sm rounded border" alt="Item">
                            </div>
                            <div class="col-md-6">
                                <h6 class="mb-0">Puma Speedcat OG</h6>
                                <small class="text-muted">Order ID: 6123456789</small>
                                <p class="mb-0 mt-1" style="font-size: 14px;"><strong>Reason:</strong> Size does not fit.</p>
                            </div>
                            <div class="col-md-4 text-right">
                                <span class="badge bg-info text-white mb-2">Awaiting Return</span>
                                <p class="text-muted"><small>Requested on 21 Apr 2026</small></p>
                            </div>
                        </div>
                    </div>
                </article>
            </main>
        </div>
    </div>
</section>
{% endblock %}
