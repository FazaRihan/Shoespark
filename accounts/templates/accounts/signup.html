{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="login-section">
    <div class="login-wrapper">

        <!-- Brand -->
        <div class="brand-name">SHOESPARK</div>
        <h1 class="welcome-heading">Create Account</h1>
        <p class="welcome-sub">Join Shoespark and start shopping.</p>

        <!-- Card -->
        <div class="login-card">
            {% include 'includes/alerts.html' %}

            <form method="POST" action="{% url 'account_signup' %}">
                {% csrf_token %}

                <!-- Email -->
                <div class="field-group">
                    <label class="field-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                        class="field-input"
                        placeholder="your@email.com"
                        value="{{ form.email.value|default:'' }}">
                </div>

                <!-- Username -->
                <div class="field-group">
                    <label class="field-label" for="username">Username</label>
                    <input type="text" id="username" name="username"
                        class="field-input"
                        placeholder="Username"
                        value="{{ form.username.value|default:'' }}">
                </div>

                <!-- Password -->
                <div class="field-group">
                    <label class="field-label" for="password1">Password</label>
                    <input type="password" id="password1" name="password1"
                        class="field-input"
                        placeholder="••••••••">
                </div>

                <!-- Confirm Password -->
                <div class="field-group">
                    <label class="field-label" for="password2">Confirm Password</label>
                    <input type="password" id="password2" name="password2"
                        class="field-input"
                        placeholder="••••••••">
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-signin">
                    Sign Up &nbsp;&#8594;
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span class="divider-line"></span>
                <span class="divider-text">Or</span>
                <span class="divider-line"></span>
            </div>

            <!-- Social Buttons -->
            {% load socialaccount %}
            <a href="{% provider_login_url 'google' %}"
            class="btn-social btn-google"
            style="text-decoration:none; display:flex; align-items:center; justify-content:center; gap:8px;">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right:8px;flex-shrink:0;">
                    <path d="M17.64 9.20455C17.64 8.56636 17.5827 7.95273 17.4764 7.36364H9V10.845H13.8436C13.635 11.97 13.0009 12.9232 12.0477 13.5614V15.8195H14.9564C16.6582 14.2527 17.64 11.9455 17.64 9.20455Z" fill="#4285F4"/>
                    <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5614C11.2418 14.1014 10.2109 14.4204 9 14.4204C6.65591 14.4204 4.67182 12.8373 3.96409 10.71H0.957275V13.0418C2.43818 15.9832 5.48182 18 9 18Z" fill="#34A853"/>
                    <path d="M3.96409 10.71C3.78409 10.17 3.68182 9.59318 3.68182 9C3.68182 8.40682 3.78409 7.83 3.96409 7.29V4.95818H0.957275C0.347727 6.17318 0 7.54773 0 9C0 10.4523 0.347727 11.8268 0.957275 13.0418L3.96409 10.71Z" fill="#FBBC05"/>
                    <path d="M9 3.57955C10.3214 3.57955 11.5077 4.03364 12.4405 4.92545L15.0218 2.34409C13.4632 0.891818 11.4259 0 9 0C5.48182 0 2.43818 2.01682 0.957275 4.95818L3.96409 7.29C4.67182 5.16273 6.65591 3.57955 9 3.57955Z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </a>

            <!-- Login Link -->
            <p class="register-link">
                Already have an account?&nbsp;
                <a href="{% url 'login' %}">Sign In</a>
            </p>
        </div>

    </div>
</section>
{% endblock %}
