{% extends 'base.html' %}

{% block content %}
<section class="section-content padding-y bg">
    <div class="container">
        <div class="row">
            {% include 'accounts/sidebar.html' %}
            
            <main class="col-md-9">
                <article class="card">
                    <header class="card-header">
                        <strong class="d-inline-block mr-3">Account Settings</strong>
                    </header>
                    <div class="card-body">
                        <form action="{% url 'settings' %}" method="POST"> {% csrf_token %} <div class="form-row row mb-3">
                            <div class="form-row row mb-3">
                                <div class="col form-group">
                                    <label>First Name</label>
                                    <input type="text" class="form-control" value="Ridho">
                                </div>
                                <div class="col form-group">
                                    <label>Last Name</label>
                                    <input type="text" class="form-control" value="Rahmaesa">
                                </div>
                            </div>
                            <div class="form-row row mb-3">
                                <div class="col form-group">
                                    <label>Email Address</label>
                                    <input type="email" class="form-control" value="Ridhorahmaesa@gmail.com" readonly>
                                </div>
                                <div class="col form-group">
                                    <label>Phone Number</label>
                                    <input type="text" class="form-control" value="+6281353679813">
                                </div>
                            </div>
                            <div class="form-group mt-4">
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </article>
            </main>
        </div>
    </div>
</section>
{% endblock %}
