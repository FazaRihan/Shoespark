{% extends 'base.html' %}

{% block content %}
<section class="section-content padding-y bg">
    <div class="container">
        <div class="row">
            {% include 'accounts/sidebar.html' %}
            
            <main class="col-md-9">
                <article class="card">
                    <header class="card-header d-flex justify-content-between align-items-center">
                        <strong class="d-inline-block mr-3">My Selling Items</strong>
                        <a href="#" class="btn btn-success btn-sm">+ Add New Product</a>
                    </header>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <figure class="card card-product-grid">
                                    <div class="img-wrap p-2"> 
                                        <img src="https://via.placeholder.com/150" class="img-fluid rounded" alt="Shoes">
                                    </div>
                                    <figcaption class="info-wrap p-3 border-top">
                                        <a href="#" class="title">Nike Air Max</a>
                                        <div class="price mt-1">$120.00</div>
                                        <div class="mt-2">
                                            <a href="#" class="btn btn-outline-primary btn-sm btn-block">Edit</a>
                                        </div>
                                    </figcaption>
                                </figure>
                            </div>
                        </div>
                    </div>
                </article>
            </main>
        </div>
    </div>
</section>
{% endblock %}
