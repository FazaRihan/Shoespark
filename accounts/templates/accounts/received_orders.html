{% extends 'base.html' %}

{% block content %}
<section class="section-content padding-y bg">
    <div class="container">
        <div class="row">
            {% include 'accounts/sidebar.html' %}
            
            <main class="col-md-9">
                <article class="card">
                    <header class="card-header">
                        <strong class="d-inline-block mr-3">Received Orders</strong>
                    </header>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead class="text-muted">
                                <tr>
                                    <th scope="col">Order ID</th>
                                    <th scope="col">Buyer</th>
                                    <th scope="col">Price</th>
                                    <th scope="col">Status</th>
                                    <th scope="col" class="text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><a href="#">#ORD-5541</a></td>
                                    <td>Faza Rihan</td>
                                    <td>$120.00</td>
                                    <td><span class="badge bg-danger text-white">To Ship</span></td>
                                    <td class="text-right">
                                        <button class="btn btn-primary btn-sm">Process Order</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </article>
            </main>
        </div>
    </div>
</section>
{% endblock %}
